<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web OS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="login-screen" class="login-screen">
      <div class="login-panel">
        <h1>Web OS</h1>
        <p>Přihlášení</p>
        <form id="login-form">
          <label>
            <span>Uživatelské jméno</span>
            <input id="username" type="text" value="admin" autocomplete="username" />
          </label>
          <label>
            <span>Heslo</span>
            <input id="password" type="password" value="admin" autocomplete="current-password" />
          </label>
          <button type="submit">Přihlásit</button>
          <div id="login-error" class="login-error"></div>
        </form>
      </div>
    </div>

    <div class="desktop hidden-on-login">
      <div class="desktop-icons" id="desktop-icons"></div>
      <div class="windows-layer" id="windows-layer"></div>
    </div>

    <div class="taskbar hidden-on-login" id="taskbar">
      <button class="start-button" id="start-button">Start</button>
      <div class="taskbar-apps" id="taskbar-apps"></div>
      <div class="tray">
        <span id="clock" class="clock"></span>
      </div>
    </div>

    <div class="start-menu hidden" id="start-menu">
      <button class="menu-item" data-app="notepad">Notepad</button>
      <button class="menu-item" data-app="files">Files</button>
      <button class="menu-item" data-app="browser">Browser</button>
      <button class="menu-item" data-app="terminal">Terminal</button>
      <button class="menu-item" data-app="calculator">Calculator</button>
      <button class="menu-item logout" data-action="logout">Odhlásit</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
  <!-- Předtím: <main class="desktop hidden-on-login" style="display: none;"> -->
  <main class="desktop hidden-on-login">
    <div id="desktop-icons" class="desktop-icons"></div>
    <div id="windows-layer" class="windows-layer"></div>
    <div id="start-menu" class="start-menu hidden"></div>
  </main>

  <!-- Předtím: <footer class="taskbar hidden-on-login" style="display: none;"> -->
  <footer class="taskbar hidden-on-login">
    <button id="start-button" class="start-button" type="button" aria-label="Nabídka aplikací">
      <span style="filter: drop-shadow(0 0 4px rgba(61,174,233,0.6));">🌀</span>
    </button>
    <div id="taskbar-apps" class="taskbar-apps"></div>
    <div class="tray">
      <span style="font-size: 0.95rem; cursor: pointer;" title="Připojení k síti">🌐</span>
      <span style="font-size: 0.95rem; cursor: pointer;" title="Hlasitost">🔊</span>
      <time id="clock" class="clock"></time>
    </div>
  </footer>
